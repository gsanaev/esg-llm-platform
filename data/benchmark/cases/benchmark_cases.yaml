benchmark_cases:
  - case_id: "alpha_structured_table"
    company_id: "synthetic_alpha"
    disclosure_format: "table"
    output_filename: "alpha_structured_table.pdf"

  - case_id: "alpha_clean_narrative"
    company_id: "synthetic_alpha"
    disclosure_format: "narrative"
    output_filename: "alpha_clean_narrative.pdf"

  - case_id: "beta_locale_table"
    company_id: "synthetic_beta"
    disclosure_format: "table"
    number_format: "de"
    output_filename: "beta_locale_table.pdf"

  - case_id: "beta_mixed_units"
    company_id: "synthetic_beta"
    disclosure_format: "table"
    unit_overrides:
      energy_consumption: "GWh"
    output_filename: "beta_mixed_units.pdf"

  - case_id: "alpha_missing_water_consumption"
    company_id: "synthetic_alpha"
    disclosure_format: "table"
    omitted_metrics:
      - water_consumption
    expected_reconciliation:
      water_consumption:
        conflict_flag: false
        review_required: false
        status: "not_reported"
    output_filename: "alpha_missing_water_consumption.pdf"

  - case_id: "alpha_conflicting_water_withdrawal"
    company_id: "synthetic_alpha"
    disclosure_format: "table"
    conflicting_values:
      water_withdrawal:
        - 1250000
    expected_reconciliation:
      water_withdrawal:
        conflict_flag: true
        review_required: true
        status: "review_required"
    output_filename: "alpha_conflicting_water_withdrawal.pdf"
