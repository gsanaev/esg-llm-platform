[project]
name = "esg-llm-platform"
version = "2.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "camelot-py>=1.0.9",
    "ghostscript>=0.8.1",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.7",
    "nbconvert[webpdf]>=7.16.6",
    "openai>=2.8.0",
    "pandas>=2.3.3",
    "pdfplumber>=0.11.8",
    "pymupdf>=1.26.6",
    "pytest>=9.0.1",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "reportlab>=4.4.5",
]

[project.scripts]
esg-extract = "esg.cli.run_v2:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["esg*"]
namespaces = true

[tool.setuptools.package-data]
esg = ["schemas/*.json"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
