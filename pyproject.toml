[project]
name = "esg-llm-platform"
version = "2.0.0"
description = "Reproducible ESG KPI extraction, reconciliation, and benchmark pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.8.0",
    "pdfplumber>=0.11.8",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "reportlab>=4.4.5",
]

[project.scripts]
esg-extract = "esg.cli.run_v2:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["esg*"]
namespaces = true

[tool.setuptools.package-data]
esg = ["schemas/*.json"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbconvert[webpdf]>=7.16.6",
    "pandas>=2.3.3",
    "pytest>=9.0.1",
]
